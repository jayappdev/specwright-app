<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="t">
  <title id="t">SpecWright</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#6e40c9"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8ecf2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0d1117" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824×824 tile with continuous-ish corners -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <!-- soft light from the top -->
  <path d="M100 290 C100 175 175 100 290 100 H734 C849 100 924 175 924 290 V420 C760 360 300 360 100 470 Z" fill="#ffffff" opacity=".08"/>

  <!-- the spec page, folded corner top right -->
  <g filter="url(#shadow)">
    <path d="M292 214 H604 L732 342 V770 a40 40 0 0 1 -40 40 H292 a40 40 0 0 1 -40 -40 V254 a40 40 0 0 1 40 -40 Z" fill="url(#page)"/>
    <path d="M604 214 V302 a40 40 0 0 0 40 40 H732 Z" fill="#c9d1d9"/>
  </g>

  <!-- spec: prose lines -->
  <g stroke-linecap="round" stroke-width="26">
    <path d="M318 300 H540" stroke="#8c959f"/>
    <path d="M318 360 H588" stroke="#afb8c1"/>
    <path d="M318 420 H500" stroke="#afb8c1"/>
  </g>

  <!-- …becoming code -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="30">
    <path d="M374 520 L322 572 L374 624" stroke="#1f6feb"/>
    <path d="M470 504 L430 640" stroke="#8250df"/>
    <path d="M526 520 L578 572 L526 624" stroke="#1f6feb"/>
  </g>
  <path d="M318 712 H452" stroke="#afb8c1" stroke-width="26" stroke-linecap="round"/>

  <!-- the approval gate: a diamond with a check -->
  <g transform="translate(700 700)">
    <rect x="-118" y="-118" width="236" height="236" rx="40" transform="rotate(45)" fill="#ffffff"/>
    <rect x="-96" y="-96" width="192" height="192" rx="30" transform="rotate(45)" fill="#2da44e"/>
    <path d="M-54 2 L-14 42 L58 -40" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
